name: Deploy docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -e ".[docs]"

      # The gallery docs page is generated from the committed notebook
      # outputs (no execution) — see scripts/export_gallery.py.
      - run: python scripts/export_gallery.py

      # --strict fails the deploy on any broken internal link or cross-reference.
      - run: mkdocs build --strict

      - run: mkdocs gh-deploy --force
