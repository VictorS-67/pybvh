name: Docs

# No `paths:` filter: `docs-build` is meant to be a required check, and a required
# check whose workflow a path filter skips stays pending and blocks the merge.
on:
  # Any base branch: a stacked pull request is checked against its parent.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Both jobs build through .github/actions/build-docs, so the pull-request
# check and the deploy cannot drift apart.
jobs:
  # The pull-request check. Push events skip it because `deploy` runs the same
  # strict build before publishing.
  docs-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs

      - run: mkdocs gh-deploy --force
