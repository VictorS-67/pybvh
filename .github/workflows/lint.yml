name: Lint

on:
  push:
    branches: [main]
  # Any base branch: a stacked pull request is checked against its parent.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same exact version as the dev extra in pyproject.toml: bump the
      # two together. ruff alone is enough to lint; the rules come from
      # [tool.ruff] in pyproject.toml.
      - run: python -m pip install ruff==0.16.9

      # Reviewers read the diff, not the job log: the github format puts each
      # finding there as an annotation on the line it concerns.
      - run: ruff check --output-format=github .

      # Fails on any file the formatter would change, and prints the diff.
      # A notebook's fix also goes to its jupytext twin: "How to edit" in
      # docs/tutorials.md gives the commands.
      - run: ruff format --check .
