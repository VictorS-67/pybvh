name: Lint

on:
  push:
    branches: [main]
  # Any base branch: a stacked pull request is checked against its parent.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lint group of pyproject.toml holds ruff's pin, and [tool.ruff]
      # its rules; ruff alone is enough to lint. pip reads dependency groups
      # from 25.1 on, and the runner's pip is whatever its Python was built
      # with, so it is upgraded first.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint

      # Reviewers read the diff, not the job log: the github format puts each
      # finding there as an annotation on the line it concerns.
      - run: ruff check --output-format=github .

      # Fails on any file the formatter would change, and prints the diff.
      # A notebook's fix also goes to its jupytext twin: "How to edit" in
      # docs/tutorials.md gives the commands.
      - run: ruff format --check .
