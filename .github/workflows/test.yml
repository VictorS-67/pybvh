name: Tests

on:
  push:
    branches: [main]
  # Any base branch: a stacked pull request is checked against its parent.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system packages
      # ffmpeg exercises render(codec="h264"/"auto")'s H.264 pipe path,
      # which is skipped wherever the binary is absent.
      # Above the mirror limits of system_packages.sh, which fail first
      # with a message naming the mirror; this one bounds the rest.
      timeout-minutes: 12
      uses: ./.github/actions/system-packages
      with:
        packages: ffmpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev
    - name: Run tests
      # pybvh/ with --doctest-modules runs the examples in the docstrings.
      run: python -m pytest tests/ pybvh/ --doctest-modules -v
