name: Typecheck

on:
  push:
    branches: [main]
  # Any base branch: a stacked pull request is checked against its parent.
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The python_version of [tool.mypy] in pyproject.toml: the oldest
      # Python pybvh supports. Running on it installs the NumPy and
      # Matplotlib releases a user of that Python resolves, whose stubs are
      # the ones the package must type-check against; a newer Python would
      # install newer releases, whose stubs can type the same calls
      # differently.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The typecheck group of pyproject.toml holds the mypy and stub pins.
      # The opencv extra ships its own stubs, so the OpenCV backend's calls
      # are checked against them; the other optional packages are listed in
      # the mypy overrides. So is Matplotlib's 3D toolkit, which ships no
      # stubs: Axes3D is Any to mypy, so calls on the backend's 3D axes are
      # left to the plotting tests. pip reads dependency groups from 25.1 on,
      # and the runner's pip is whatever its Python was built with, so it is
      # upgraded first.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[opencv]" --group typecheck

      - run: mypy pybvh/
