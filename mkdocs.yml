site_name: pybvh
site_description: A lightweight Python library for BVH motion capture files
site_url: https://victors-67.github.io/pybvh/
repo_url: https://github.com/VictorS-67/pybvh
repo_name: VictorS-67/pybvh

# docs/internal_logs/ is the gitignored internal development history — never
# part of the site, even from a local `mkdocs build` / `gh-deploy` where the
# directory exists on disk (CI checkouts never contain it).
# docs/agents/ is agent-workflow configuration (issue tracker, triage labels,
# domain-doc rules), not user documentation.
exclude_docs: |
  /internal_logs/
  /agents/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Gallery: gallery/index.md
  - User Guide:
    - Core Concepts: guide/core-concepts.md
    - World Up & Orientation: guide/world-up.md
    - Rotation Representations & SE(3): guide/rotations.md
    - Choosing a Representation: guide/choosing-rotations.md
    - Data Augmentation: guide/augmentation.md
    - Feature Export: guide/feature-export.md
    - Skeleton Operations: guide/skeleton-ops.md
    - Motion Descriptors: guide/motion-descriptors.md
  - API Reference:
    - api/index.md
    - Bvh Class: api/bvh.md
    - I/O: api/io.md
    - Rotations & SE(3): api/rotations.md
    - Geometry (trajectory & pose): api/geometry.md
    - Transforms (augmentation): api/transforms.md
    - Analysis (contacts, gait, smoothness): api/analysis.md
    - Features (ML export): api/features.md
    - Signal: api/signal.md
    - Batch Processing: api/batch.md
    - Visualization: api/bvhplot.md
  - Tutorials: tutorials.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
