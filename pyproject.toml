[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybvh"
version = "0.9.0"
description = "BVH reader/writer and kinematics utilities"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Schneider", email = "victor.schneider67@gmail.com" }]
keywords = ["bvh", "motion capture", "kinematics", "animation"]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
opencv = ["opencv-python>=4.5"]
interactive = ["k3d>=2.14"]
viewer = ["vedo>=2025.5.3"]
all-viz = ["opencv-python>=4.5", "k3d>=2.14", "vedo>=2025.5.3"]
# mkdocs 2 drops the plugin system mkdocstrings and Material are built on, and
# the docs-build check installs this extra fresh on every pull request.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pillow>=9.0"]
# Reference libraries for REGENERATING the golden fixtures in tests/fixtures/.
# Dev-only — never a runtime dependency; the committed .npz fixtures load with
# numpy alone, so running the tests does not need these. See tests/fixtures/README.md.
fixtures = ["scipy>=1.11", "pytransform3d>=3.0"]

[project.urls]
Homepage = "https://github.com/VictorS-67/pybvh"
Repository = "https://github.com/VictorS-67/pybvh"
Issues = "https://github.com/VictorS-67/pybvh/issues"

# The development tools, for working on pybvh rather than using it: they are
# not published as an extra. Install them with pip 25.1 or later, which reads
# these groups: `pip install -e . --group dev` (CONTRIBUTING.md), and the CI
# jobs install the group they need, so no workflow repeats a version.
[dependency-groups]
# Exact pins: CI installs these same versions, so a ruff release adding a rule,
# or a mypy or stub release reading the code differently, cannot turn the lint
# or typecheck job red on its own. Bump them deliberately. The ruff hooks in
# .pre-commit-config.yaml run in their own environment, pinned by their `rev`,
# which tests/test_release_metadata.py holds equal to the ruff pin here.
lint = ["ruff==0.16.9"]
typecheck = [
    "mypy==1.19.1",
    # pybvh never imports pandas at run time; dataframe.py names its types for
    # the checker only, and pandas ships none of its own. The last release that
    # installs on the oldest Python pybvh supports, where the typecheck job runs.
    "pandas-stubs==2.3.3.260113",
]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    "pytest>=8", "pandas>=1.5", "jupytext>=1.16", "nbmake>=1.5",
    "pre-commit>=3.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"pybvh" = ["API_RENAME.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pybvh*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The jupytext twins of the notebooks: ruff lints the .ipynb itself, where it
# knows the cell boundaries (an import at the top of a cell is fine, a trailing
# semicolon that suppresses a cell's output is not useless). Linting the .py as
# one flat module would report every finding twice and misread both.
extend-exclude = ["tutorials/*.py", "gallery/feature_gallery.py"]

[tool.ruff.format]
# ruff also formats the Python blocks in Markdown files. The docs' blocks are
# cheat sheets whose comments are aligned into a column the reader scans
# down, which the formatter would collapse; they keep their page's layout.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "D1", "D417"]
# The formatter owns line length (#57). D105: the dunders left without a
# docstring are __str__ and __repr__, whose contract is Python's data model
# and whose body already shows the text it builds. Dunders with behaviour of
# their own (__eq__, __getitem__, __add__, ...) should carry one, but the rule
# cannot tell the two kinds apart. B905 (zip() without strict=) applies from
# Python 3.10 on, and the zips written before it each need a choice: strict=True
# where the lengths must agree, strict=False where truncating is meant. #87
# makes that choice at each zip and drops B905 from this list.
ignore = ["E501", "D105", "B905"]

[tool.ruff.lint.isort]
# The gallery notebook's helper module sits beside it, not on any import path
# ruff can see, so ruff would otherwise file it with the third-party packages.
known-local-folder = ["gallery_plots"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstrings are the public API reference, which only the package has.
"!pybvh/**" = ["D"]

[tool.mypy]
# The oldest Python pybvh supports: syntax or a typing feature newer than it
# is reported. CI runs mypy on this same version, so that the installed NumPy
# and Matplotlib, and the stubs they ship, are the ones a user of that
# version resolves.
python_version = "3.10"
files = ["pybvh"]

[[tool.mypy.overrides]]
# Optional packages with no type information: k3d, vedo, ipywidgets, and
# Matplotlib's mpl_toolkits (no py.typed). Their objects are Any to mypy.
module = ["k3d", "k3d.*", "vedo", "vedo.*", "ipywidgets", "ipywidgets.*", "mpl_toolkits.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional packages that ship their own types but are not installed with
# pybvh: opencv (cv2), IPython and VTK (vtk, vtkmodules). Where one is installed,
# mypy checks the calls against its types; where it is absent, its import is
# not an error. The typecheck job installs opencv, the one whose calls carry
# the most code.
module = ["cv2", "cv2.*", "IPython", "IPython.*", "vtk", "vtkmodules", "vtkmodules.*"]
ignore_missing_imports = true
