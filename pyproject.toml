[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybvh"
version = "0.9.0"
description = "BVH reader/writer and kinematics utilities"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Schneider", email = "victor.schneider67@gmail.com" }]
keywords = ["bvh", "motion capture", "kinematics", "animation"]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
opencv = ["opencv-python>=4.5"]
interactive = ["k3d>=2.14"]
viewer = ["vedo>=2024.5"]
all-viz = ["opencv-python>=4.5", "k3d>=2.14", "vedo>=2024.5"]
dev = [
    "pytest>=8", "pandas>=1.5", "mypy>=1.0", "jupytext>=1.16", "nbmake>=1.5",
    # Exact pin: CI installs this same version, so a ruff release adding a rule
    # cannot turn the lint job red on its own. Bump it deliberately.
    "ruff==0.16.9",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pillow>=9.0"]
# Reference libraries for REGENERATING the golden fixtures in tests/fixtures/.
# Dev-only — never a runtime dependency; the committed .npz fixtures load with
# numpy alone, so running the tests does not need these. See tests/fixtures/README.md.
fixtures = ["scipy>=1.11", "pytransform3d>=3.0"]

[project.urls]
Homepage = "https://github.com/VictorS-67/pybvh"
Repository = "https://github.com/VictorS-67/pybvh"
Issues = "https://github.com/VictorS-67/pybvh/issues"

[tool.setuptools]
include-package-data = false
exclude-package-data = {"*" = ["CLAUDE.md"]}

[tool.setuptools.package-data]
"pybvh" = ["API_RENAME.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pybvh*"]

[tool.ruff]
line-length = 100
target-version = "py39"
# The jupytext twins of the notebooks: ruff lints the .ipynb itself, where it
# knows the cell boundaries (an import at the top of a cell is fine, a trailing
# semicolon that suppresses a cell's output is not useless). Linting the .py as
# one flat module would report every finding twice and misread both.
extend-exclude = ["tutorials/*.py", "gallery/feature_gallery.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "D1", "D417"]
# The formatter owns line length (#57). D105: the dunders left without a
# docstring are __str__ and __repr__, whose contract is Python's data model
# and whose body already shows the text it builds. Dunders with behaviour of
# their own (__eq__, __getitem__, __add__, ...) should carry one, but the rule
# cannot tell the two kinds apart.
ignore = ["E501", "D105"]

[tool.ruff.lint.isort]
# The gallery notebook's helper module sits beside it, not on any import path
# ruff can see, so ruff would otherwise file it with the third-party packages.
known-local-folder = ["gallery_plots"]

[tool.ruff.lint.pyupgrade]
# Keep Union and Optional: typing.get_type_hints evaluates X | Y, which fails on Python 3.9.
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstrings are the public API reference, which only the package has.
"!pybvh/**" = ["D"]
